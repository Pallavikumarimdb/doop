# Builds distributable desktop releases (macOS DMG + Windows NSIS installer).
# - Tag `desktop-v*` → builds and attaches the installers to a GitHub Release.
# - Manual dispatch → builds and uploads the installers as workflow artifacts.
# - PRs touching this file → same as dispatch, so the pipeline stays validated.
#
# Signing + notarization happen automatically once the APPLE_* repo secrets
# exist (see desktop/README.md). Until then the DMG is unsigned: it works,
# but downloaders must approve it in System Settings → Privacy & Security.
name: Desktop Release

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/desktop-release.yml']

permissions:
  contents: write

jobs:
  dmg-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        with:
          workspaces: desktop/src-tauri
      - run: bun install --frozen-lockfile
        working-directory: desktop
      - name: Build DMG (signed + notarized when APPLE_* secrets are set)
        working-directory: desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # unset secrets take precedence over none at all: tauri treats an
          # empty env var as configured and fails, so drop the empty ones
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "::warning::APPLE_* secrets not set — building an UNSIGNED dmg (System Settings → Open Anyway required)"
          fi
          bunx tauri build --target universal-apple-darwin --bundles dmg
      - name: Attach DMG to release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
      - name: Upload DMG artifact
        if: "!startsWith(github.ref, 'refs/tags/desktop-v')"
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: doop-dmg
          path: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  nsis-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        with:
          workspaces: desktop/src-tauri
      - run: bun install --frozen-lockfile
        working-directory: desktop
      - name: Build Windows installer
        working-directory: desktop
        run: bunx tauri build --bundles nsis
      - name: Attach Windows installer to release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: desktop/src-tauri/target/release/bundle/nsis/*.exe
      - name: Upload Windows installer artifact
        if: "!startsWith(github.ref, 'refs/tags/desktop-v')"
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: doop-windows-setup
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
